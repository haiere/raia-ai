<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Raia AI</title>
    <script>
      /* Fallback GitHub Pages untuk rute /chat dan /setting (History API).
         pathSegmentsToKeep: 1 untuk situs proyek (hajir.is-a.dev/raia-ai/),
         0 untuk situs di root domain. Hapus file ini jika host mendukung fallback SPA. */
      (function () {
        var pathSegmentsToKeep = 1;
        var l = window.location;
        var segments = l.pathname.split('/');
        var base = segments.slice(0, pathSegmentsToKeep + 1).join('/');
        var route = segments.slice(pathSegmentsToKeep + 1).join('/');
        l.replace(base + '/?/' + encodeURI(route) + l.hash);
      })();
    </script>
</head>
<body>
    <p>Mengalihkan…</p>
</body>
</html>
